<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Jesus Christ archive</title>
<style>
  body { margin: 0; background: #fdfdfb; color: #1b1b19; font: 16px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) { body { background: #141413; color: #e8e6df; } a { color: #d89a72; } }
  main { padding: 3rem 1.5rem; max-width: 46rem; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  a { color: #7a2e12; }
</style>
<script>
  // Deep links sometimes arrive as real paths rather than hash routes
  // (/doc/fathers/didache instead of /#/doc/fathers/didache). Rewrite them so
  // the reader opens the right page instead of a 404.
  // The replacement target is absolute: a relative "./" resolves against the
  // deep path's own directory and silently drops the collection segment.
  (function () {
    var base = /\/all-historical-evidence-of-jesus-christ\/?/.exec(location.pathname);
    var root = location.origin + (base ? base[0] : "/");
    var rest = base ? location.pathname.slice(base[0].length) : location.pathname.replace(/^\//, "");
    var map = { "doc/": "#/doc/", "ref/": "#/ref/", "collection/": "#/collection/", "search/": "#/search/" };
    for (var key in map) {
      if (rest.indexOf(key) === 0) {
        location.replace(root + map[key] + rest.slice(key.length).replace(/\/$/, ""));
        return;
      }
    }
    if (rest) location.replace(root);
  })();
</script>
</head>
<body>
<main>
    <h1 class="page-title">Page not found</h1>
    <p class="page-lede">That address is not part of the archive. <a href="./">Go to the index</a>,
      or press <kbd>/</kbd> after it opens to search all 335 documents.</p>
</main>
</body>
</html>
